<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本機生圖</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang TC", "Hiragino Sans GB", sans-serif;
         background: #141414; color: #eee; }
  header { padding: 14px 20px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
  header .brand { display: flex; gap: 14px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: #888; font-size: 13px; }
  #shutdownBtn { margin: 0; width: auto; padding: 6px 14px; font-size: 13px; font-weight: 500; background: #331f1f; color: #ff9999; border: 1px solid #552828; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  #shutdownBtn:hover { background: #552222 !important; border-color: #883333 !important; color: #ffcccc !important; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: #bbb; }
  select, input[type=text], input[type=number], textarea {
    width: 100%; box-sizing: border-box; background: #111; color: #eee; border: 1px solid #333;
    border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 14px; }
  textarea { height: 120px; resize: vertical; color: #aaa; font-size: 12px; line-height: 1.5; }
  button { margin-top: 14px; width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0;
           border-radius: 8px; background: #3b7dd8; color: #fff; cursor: pointer; }
  button:disabled { background: #333; color: #777; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .note { font-size: 12px; color: #777; margin-top: 6px; }
  .checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 10px; max-height: 168px; overflow: auto;
            border: 1px solid #333; border-radius: 6px; padding: 7px 9px; background: #111; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12.5px; color: #ccc; }
  .checks input { margin: 0; }
  #status { margin: 0 0 14px; padding: 10px 14px; border-radius: 8px; background: #1c1c1c;
            border: 1px solid #2a2a2a; font-size: 14px; }
  #status.err { border-color: #8a3b3b; color: #ffb4b4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .grid a { display: block; }
  .grid img { width: 100%; border-radius: 8px; display: block; background: #222; }
  .cap { font-size: 12px; color: #999; margin-top: 4px; }
  #ref { font-size: 13px; }
  #refPrev { max-width: 120px; border-radius: 6px; margin-top: 8px; display: none; }
  .grid img { cursor: zoom-in; }
  .up { margin-top: 6px; width: 100%; box-sizing: border-box; padding: 6px; font: inherit; font-size: 12px;
        font-weight: 500; border-radius: 6px; background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a;
        cursor: pointer; display: block; text-align: center; text-decoration: none; }
  .up:disabled { color: #666; cursor: default; }
  a.up { color: #8bb8f5; }
  #light { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .93); padding: 20px;
           display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  #light[hidden] { display: none; }
  #light img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<header>
  <div class="brand">
    <h1>本機生圖</h1>
    <span id="hw" style="font-size:12px; background:#1e2d45; color:#8ab4f8; padding:2px 10px; border-radius:12px; font-weight:500;"></span>
    <span id="mem">只跑在這台 Mac，外面連不到</span>
    <span id="stale" style="color:#ffb4b4" hidden>⚠ 這是舊版頁面，請按 ⌘R 重新整理</span>
  </div>
  <div>
    <button type="button" id="shutdownBtn" title="結束背景 Python 伺服器並釋放記憶體">🛑 關閉伺服器</button>
  </div>
</header>
<main>
  <form class="panel" id="form">
    <label>寫法</label>
    <select id="variant"></select>

    <label>模型</label>
    <select id="model_id"></select>

    <div class="row">
      <div><label>膚色調性 <span style="color:#8ab4f8; font-size:11px; font-weight:normal;">（可覆蓋參考圖泛黃）</span></label><select id="skin"></select></div>
      <div><label>胸型</label><select id="bust"></select></div>
    </div>
    <div class="row">
      <div><label>長相／髮型</label><select id="face"></select></div>
      <div><label>取景</label><select id="framing"></select></div>
    </div>

    <label>姿勢（可複選；不勾＝原本站姿）</label>
    <div id="poses" class="checks"></div>

    <label>尺寸</label>
    <select id="size"></select>
    <div class="note">尺寸只決定畫布比例；要全身還是半身請用上面的「取景」。</div>

    <div class="row">
      <div><label>每種姿勢張數</label><input type="number" id="count" value="1" min="1" max="8"></div>
      <div><label>指定 seed（可留空）</label><input type="text" id="seeds" placeholder="例：314159, 271828"></div>
    </div>
    <div class="note" id="planNote"></div>

    <label>參考圖（極致鎖臉，支援 1～3 張互補視角）</label>
    <div style="background:#111; border:1px solid #333; border-radius:6px; padding:10px 12px; margin-bottom:8px;">
      <div style="display:flex; flex-direction:column; gap:7px; font-size:13px;">
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer; color:#8ab4f8; font-weight:600;">
          <input type="radio" name="ref_mode" value="preset_combo" checked>
          ★ 蘇菲·瑪索 (Sophie Marceau) 經典 3 圖鎖臉（ref-03 正面基準 ＋ ref-01 側顏 ＋ ref-04）
        </label>
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="radio" name="ref_mode" value="custom_preset">
          自選 reference/ 圖庫（勾選 1～3 張）
        </label>
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="radio" name="ref_mode" value="upload">
          自行上傳照片（可多選 1～3 張）
        </label>
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer; color:#888;">
          <input type="radio" name="ref_mode" value="none">
          不使用參考圖（純文字提示詞）
        </label>
      </div>

      <!-- 自選 reference/ 圖庫勾選清單 -->
      <div id="customPresetArea" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid #222;">
        <div style="font-size:12px; color:#aaa; margin-bottom:6px;">請勾選 1～3 張（以正面為準搭配側顏）：</div>
        <div id="presetChecks" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:5px; max-height:160px; overflow-y:auto; font-size:12px;"></div>
      </div>

      <!-- 上傳區 -->
      <div id="uploadArea" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid #222;">
        <input type="file" id="refUpload" accept="image/*" multiple style="font-size:12px;">
        <div class="note">提示：按住 Command 或 Shift 可多選最多 3 張圖片。</div>
      </div>

      <!-- 預覽縮圖區 -->
      <div id="refPrevContainer" style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"></div>
      <div id="refLockBadge" style="font-size:12px; color:#4ade80; margin-top:6px; font-weight:500;">
        🔒 已啟用極致鎖臉：3 張參考特徵（正面主基準 ＋ 側顏 ＋ 視角）· 1024px 高清裁臉
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin: 14px 0 4px;">
      <label style="margin:0; font-weight:600; color:#eee;">實際送出的 Prompt（可自由編輯無審查詞）</label>
      <label style="margin:0; font-size:12px; color:#8ab4f8; display:flex; align-items:center; gap:4px; cursor:pointer; font-weight:500;">
        <input type="checkbox" id="customPromptLock"> 鎖定自訂內容（不被選單覆蓋）
      </label>
    </div>
    <textarea id="prompt" placeholder="可直接編輯或輸入任何無審查 Prompt（例如 topless, nude fine art, sensual lingerie, sheer silk...）"></textarea>
    <div class="note" style="color:#aaa;">🔥 無審查已啟用：可直接在此輸入或修改任何大膽寫真/人體關鍵詞；若有選取上方參考圖，系統會自動在送出時保持臉部鎖定！</div>

    <button type="submit" id="go">生成</button>
  </form>

  <section>
    <div id="status">待命中</div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div id="light" hidden><img id="lightImg" alt="放大檢視"></div>
<script>
const $ = id => document.getElementById(id);
const BUILD = '__BUILD__';  // 由後端塞入 index.html 的修改時間，用來偵測瀏覽器拿到舊版頁面
let currentRefMode = 'preset_combo';
let presetRefsList = [];
let uploadRefsData = [];

function fill(sel, items, key = 'key', label = 'label') {
  sel.innerHTML = items.map(i => typeof i === 'string'
    ? `<option value="${i}">${i}</option>`
    : `<option value="${i[key]}">${i[label]}</option>`).join('');
}

function getSelectedRefs() {
  if (currentRefMode === 'preset_combo') {
    return ['reference/ref-03.jpeg', 'reference/ref-01.jpg', 'reference/ref-04.jpeg'];
  }
  if (currentRefMode === 'custom_preset') {
    return [...document.querySelectorAll('#presetChecks input:checked')].map(i => i.value);
  }
  if (currentRefMode === 'upload') {
    return uploadRefsData;
  }
  return [];
}

function updateRefPreview() {
  const refs = getSelectedRefs();
  const container = $('refPrevContainer');
  container.innerHTML = '';
  if (refs.length === 0) {
    $('refLockBadge').style.display = 'none';
    syncRef();
    refreshPrompt();
    return;
  }

  refs.forEach((r, idx) => {
    const card = document.createElement('div');
    card.style.cssText = 'position:relative; width:80px; height:80px; border-radius:6px; overflow:hidden; border:1px solid #3b7dd8; background:#222; box-shadow:0 2px 5px rgba(0,0,0,0.5);';
    const img = document.createElement('img');
    img.src = r.startsWith('data:') ? r : ('/' + r);
    img.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block;';
    const tag = document.createElement('span');
    tag.style.cssText = 'position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); color:#8ab4f8; font-size:10px; text-align:center; padding:1px 2px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; font-weight:500;';
    const name = r.startsWith('data:') ? `上傳 ${idx+1}` : r.split('/').pop();
    tag.textContent = name.includes('ref-03') ? '★正面基準' : (name.includes('ref-01') ? '側顏立體' : (name.includes('ref-04') ? '3/4視角' : name));
    card.appendChild(img);
    card.appendChild(tag);
    container.appendChild(card);
  });

  $('refLockBadge').style.display = 'block';
  $('refLockBadge').textContent = `🔒 已鎖定 ${refs.length} 張特徵 · 1024px 高清裁臉鎖定`;
  syncRef();
  refreshPrompt();
}

async function loadOptions() {
  const o = await (await fetch('/api/options')).json();
  if (o.hardware) {
    $('hw').textContent = (o.hardware.is_32gb ? '💻 ' : '🖥️ ') + o.hardware.machine + ' · ' + o.hardware.mode;
  }
  fill($('variant'), o.variants);
  fill($('model_id'), o.models, 'id');
  fill($('skin'), o.skins);
  fill($('bust'), o.busts);
  fill($('face'), o.faces);
  fill($('framing'), o.framings);
  fill($('size'), o.sizes);
  if (o.hardware && o.hardware.default_size) {
    $('size').value = o.hardware.default_size;
  }
  $('poses').innerHTML = o.poses.map(p =>
    `<label><input type="checkbox" value="${p.key}"${p.key === 'default' ? ' checked' : ''}>${p.label}</label>`).join('');
  $('skin').value = o.default_skin;

  if (o.preset_refs && o.preset_refs.length) {
    presetRefsList = o.preset_refs;
    $('presetChecks').innerHTML = o.preset_refs.map(p =>
      `<label><input type="checkbox" value="${p.path}"${p.default_selected ? ' checked' : ''}>${p.label}</label>`).join('');
  }

  updateRefPreview();
  updatePlan();
  refreshPrompt();
}

const selectedPoses = () => [...$('poses').querySelectorAll('input:checked')].map(i => i.value);

function updatePlan() {
  const n = Math.max(1, selectedPoses().length) * Number($('count').value || 1);
  $('planNote').textContent = `這次會生 ${n} 張（${Math.max(1, selectedPoses().length)} 種姿勢 × ${Number($('count').value || 1)} 張）`;
}

async function refreshPrompt() {
  if ($('customPromptLock') && $('customPromptLock').checked) return;
  const refs = getSelectedRefs();
  const count = refs.length;
  const r = await fetch('/api/prompt', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ variant: $('variant').value, skin: $('skin').value, bust: $('bust').value,
                           face: $('face').value, pose: selectedPoses()[0] || 'default',
                           framing: $('framing').value, has_ref: count > 0, ref_count: count })
  });
  const d = await r.json();
  $('prompt').value = d.prompt || d.error || '';
}

['variant', 'skin', 'bust', 'face', 'framing'].forEach(id => $(id).addEventListener('change', () => {
  if ($('variant').value.includes('自訂')) {
    $('customPromptLock').checked = true;
  }
  refreshPrompt();
}));
$('poses').addEventListener('change', () => { updatePlan(); refreshPrompt(); });
$('count').addEventListener('input', updatePlan);

$('prompt').addEventListener('input', () => {
  $('customPromptLock').checked = true;
});
$('customPromptLock').addEventListener('change', () => {
  if (!$('customPromptLock').checked) refreshPrompt();
});

function syncRef() {
  // 保持膚色選單永遠可用：即使鎖臉參考圖，也能自由指定冷白皮／粉白／自然白等覆蓋老照片泛黃
  $('skin').disabled = false;
}

document.querySelectorAll('input[name="ref_mode"]').forEach(radio => {
  radio.addEventListener('change', e => {
    currentRefMode = e.target.value;
    $('customPresetArea').style.display = (currentRefMode === 'custom_preset') ? 'block' : 'none';
    $('uploadArea').style.display = (currentRefMode === 'upload') ? 'block' : 'none';
    updateRefPreview();
  });
});

$('presetChecks').addEventListener('change', () => {
  if (currentRefMode === 'custom_preset') updateRefPreview();
});

$('refUpload').addEventListener('change', async e => {
  const files = [...e.target.files].slice(0, 3);
  uploadRefsData = [];
  for (const f of files) {
    const d = await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.readAsDataURL(f);
    });
    uploadRefsData.push(d);
  }
  updateRefPreview();
});

let lastGrid = '';
function renderGrid(results, running) {
  const html = (results || []).map(r => `
    <div><img src="${r.url}" loading="lazy" title="點圖看原尺寸">
      <div class="cap">seed ${r.seed}・${r.seconds}秒・${r.pose_label ? r.pose_label + '・' : ''}${r.variant}</div>
      ${r.up_url
        ? `<a class="up" href="${r.up_url}" target="_blank">已放大 ${r.up_size} ↗</a>`
        : `<button type="button" class="up" data-path="${r.path}"${running ? ' disabled' : ''}>🔍 SUPIR 放大 (2x)</button>`}
    </div>`).join('');
  if (html !== lastGrid) { lastGrid = html; $('grid').innerHTML = html; }
}

$('grid').addEventListener('click', async e => {
  const img = e.target.closest('img');
  if (img) { $('lightImg').src = img.src; $('light').hidden = false; return; }
  const btn = e.target.closest('button.up');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'SUPIR 放大中…';
  const r = await fetch('/api/upscale', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify({ path: btn.dataset.path }) });
  const d = await r.json();
  if (d.error) { $('status').textContent = d.error; $('status').className = 'err'; }
});

$('light').addEventListener('click', () => { $('light').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('light').hidden = true; });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true;
  const isCustom = $('customPromptLock').checked || $('variant').value.includes('自訂');
  const body = { variant: $('variant').value, model_id: $('model_id').value, skin: $('skin').value,
                 bust: $('bust').value, face: $('face').value, poses: selectedPoses(),
                 framing: $('framing').value, size: $('size').value,
                 count: Number($('count').value), seeds: $('seeds').value, refs: getSelectedRefs(),
                 custom_prompt: isCustom ? $('prompt').value : null };
  const r = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                           body: JSON.stringify(body) });
  const d = await r.json();
  if (d.error) { $('status').textContent = d.error; $('status').className = 'err'; $('go').disabled = false; }
});

async function poll() {
  const s = await (await fetch('/api/status')).json();
  const mem = s.free_pct == null ? '' : `｜可用記憶體 ${s.free_pct}%`;
  $('status').textContent = (s.error ? s.error : s.message) + (s.total ? `（${s.done}/${s.total}）` : '') + mem;
  $('status').className = s.error ? 'err' : '';
  $('go').disabled = s.running;
  $('stale').hidden = !s.build || String(s.build) === BUILD;
  renderGrid(s.results, s.running);
  setTimeout(poll, 1500);
}

$('shutdownBtn').addEventListener('click', async () => {
  if (!confirm('確定要關閉本機伺服器嗎？\n\n關閉後背景 Python 程式將完全停止，並釋放所有記憶體。\n若有正在生成的任務將會停止。')) {
    return;
  }
  $('shutdownBtn').disabled = true;
  $('shutdownBtn').textContent = '正在關閉…';
  try {
    const res = await fetch('/api/shutdown', { method: 'POST' });
    const d = await res.json();
    document.body.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:-apple-system, sans-serif; text-align:center; padding:20px; box-sizing:border-box;">
        <div style="font-size:52px; margin-bottom:16px;">🛑</div>
        <h2 style="color:#ffb4b4; margin:0 0 10px; font-size:22px;">本機伺服器已成功關閉</h2>
        <p style="color:#aaa; max-width:440px; margin:0 0 24px; font-size:14px; line-height:1.6;">後台 Python 服務與 GPU 矩陣運算已停止，系統記憶體已完整釋放。</p>
        <div style="color:#888; font-size:13px; background:#1c1c1c; padding:12px 20px; border-radius:8px; border:1px solid #2a2a2a;">
          您可以直接關閉此瀏覽器分頁。<br>下次若需使用，在終端機輸入 <code>make gui</code> 即可重新開啟。
        </div>
      </div>
    `;
  } catch (e) {
    document.body.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:-apple-system, sans-serif; text-align:center;">
        <div style="font-size:52px; margin-bottom:16px;">🛑</div>
        <h2 style="color:#ffb4b4; margin:0 0 10px;">伺服器已離線停止</h2>
        <p style="color:#888;">您可以直接關閉此瀏覽器分頁。</p>
      </div>
    `;
  }
});

loadOptions();
poll();
</script>
</body>
</html>
