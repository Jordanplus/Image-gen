<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<title>ImageGen</title>
<style>
  :root { --bg:#0b1020; --card:#161c2e; --fg:#e8ecf6; --mut:#8a94ad; --acc:#6aa6ff; --line:#27304a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system,system-ui,"Noto Sans TC",sans-serif;
         padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px); }
  h1 { font-size:18px; margin:14px 2px 12px; }
  h1 span { color:var(--mut); font-weight:400; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  textarea, select, input[type=text] { width:100%; background:#0e1422; color:var(--fg); border:1px solid var(--line);
         border-radius:10px; padding:11px; font-size:16px; }
  textarea { min-height:84px; resize:vertical; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--fg); font-size:14px; }
  .chk input { width:20px; height:20px; }
  button { width:100%; margin-top:14px; background:var(--acc); color:#04122e; border:0; border-radius:12px;
           padding:14px; font-size:17px; font-weight:600; }
  button:disabled { opacity:.5; }
  #thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  #thumbs img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  #status { color:var(--mut); font-size:14px; min-height:20px; margin-top:8px; }
  #prompt { white-space:pre-wrap; font-size:13px; color:var(--mut); background:#0e1422; border:1px solid var(--line);
            border-radius:10px; padding:10px; margin-top:8px; display:none; }
  #result { width:100%; border-radius:12px; margin-top:10px; display:none; }
  #actions { display:none; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #actions.show { display:flex; }
  #actions a, #actions button { flex:1 1 calc(50% - 4px); margin:0; width:auto; text-align:center; text-decoration:none;
    background:#1b2336; color:var(--fg); border:1px solid var(--line); border-radius:12px;
    padding:13px; font-size:15px; font-weight:600; cursor:pointer; }
  #actions button#supir_btn { flex:1 1 100%; background:#203154; color:#9ec5fe; border-color:#3d568c; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--mut); border-top-color:var(--acc);
          border-radius:50%; animation:s .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes s { to { transform:rotate(360deg); } }
  #bar, #up_bar { height:6px; border-radius:6px; background:#0e1422; border:1px solid var(--line);
         overflow:hidden; margin-top:10px; display:none; }
  #bar::before, #up_bar::before { content:''; display:block; height:100%; width:38%; background:var(--acc);
         border-radius:6px; animation:slide 1.15s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-110%); } 100% { transform:translateX(300%); } }
</style>
</head>
<body>
  <h1>🎨 ImageGen <span>· apipass gpt-image-2.5</span> <span id="hw-badge" style="display:none; font-size:12px; font-weight:normal; background:#1b2840; color:#8ab4f8; padding:3px 9px; border-radius:12px; vertical-align:middle;"></span></h1>

  <div class="card">
    <label>想生什麼？（用中文/口語描述意圖即可，Claude 會幫你寫 prompt）</label>
    <textarea id="intent" placeholder="例：黃昏的台北101復古旅遊海報，標題寫 TAIPEI"></textarea>

    <label>參考圖（選填，最多 5 張 · 鎖臉／鎖風格／角色）</label>
    <input id="files" type="file" accept="image/*" multiple>
    <div id="thumbs"></div>

    <div class="row">
      <div>
        <label>模型</label>
        <select id="model">
          <option value="openai/gpt-image-2.5-sunburst">gpt-image-2.5 Sunburst · 品質高</option>
          <option value="openai/gpt-image-2.5-flare">gpt-image-2.5 Flare · 較快</option>
          <option value="openai/gpt-image-2">gpt-image-2 · 舊版備援</option>
          <option value="google/nano-banana-pro">nano-banana-pro</option>
          <option value="google/nano-banana-2">nano-banana-2</option>
          <option value="local/flux2-klein-9b">本地 9B · 寫實高畫質(免額度,約 90 秒)</option>
        </select>
      </div>
      <div>
        <label>比例</label>
        <select id="aspect">
          <option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option>
        </select>
      </div>
      <div>
        <label>解析度</label>
        <select id="resolution">
          <option value="">預設</option><option>1K</option><option>2K</option><option>4K</option>
        </select>
      </div>
    </div>

    <label class="chk"><input id="writep" type="checkbox" checked> 讓 Claude 幫我寫 prompt（取消＝直接用上面文字）</label>

    <label>寫 prompt 的模型（丟參考圖時 Haiku 會自動升 Sonnet）</label>
    <select id="pmodel">
      <option value="haiku">Haiku · 最省額度</option>
      <option value="sonnet" selected>Sonnet · 推薦（品質≈Opus）</option>
      <option value="opus">Opus · 最強最細（燒額度快）</option>
    </select>

    <button id="go">生成</button>
    <div id="bar"></div>
    <div id="status"></div>
    <div id="prompt"></div>
    <img id="result" alt="result">
    <div id="actions">
      <button id="supir_btn">🔍 SUPIR 質感放大 (2x)</button>
      <a id="dl">📥 下載原檔</a>
      <button id="share">🔗 分享／存相簿</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:16px; margin:0;">🔍 SUPIR 照片修復／放大</h2>
      <span style="font-size:12px; color:var(--mut);">風景 · 人像 · 舊照</span>
    </div>
    <label>選擇手機相簿照片（支援相片、風景、模糊舊照）</label>
    <input id="up_file" type="file" accept="image/*">
    <div id="up_thumb_box" style="margin-top:8px; display:none;">
      <img id="up_thumb" style="max-height:120px; border-radius:8px; border:1px solid var(--line);">
    </div>

    <div class="row" style="margin-top:10px;">
      <div>
        <label>放大倍率</label>
        <select id="up_scale">
          <option value="1.5">1.5x · 輕度細緻</option>
          <option value="2.0" selected>2.0x · 推薦預設</option>
          <option value="3.0">3.0x · 大圖輸出</option>
          <option value="4.0">4.0x · 超高解析</option>
        </select>
      </div>
      <div>
        <label>細節引導提示詞（選填）</label>
        <input id="up_prompt" type="text" placeholder="例：photorealistic landscape, 8k, sharp focus">
      </div>
    </div>

    <button id="up_go" style="background:#23355a; color:#a8c8ff;">開始修復並放大</button>
    <div id="up_bar"></div>
    <div id="up_status" style="color:var(--mut); font-size:14px; min-height:20px; margin-top:8px;"></div>
    <img id="up_result" style="width:100%; border-radius:12px; margin-top:10px; display:none;" alt="upscale result">
    <div id="up_actions" style="display:none; flex-wrap:wrap; gap:8px; margin-top:10px;">
      <a id="up_dl" style="flex:1 1 calc(50% - 4px); background:#1b2336; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:13px; text-align:center; text-decoration:none; font-size:15px; font-weight:600;">📥 下載放大圖</a>
      <button id="up_share" style="flex:1 1 calc(50% - 4px); margin:0; background:#1b2336; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:13px; font-size:15px; font-weight:600;">🔗 分享／存相簿</button>
    </div>
  </div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
const $ = id => document.getElementById(id);
const thumbs = $('thumbs');
$('files').addEventListener('change', () => {
  thumbs.innerHTML = '';
  [...$('files').files].slice(0,5).forEach(f => {
    const img = document.createElement('img'); img.src = URL.createObjectURL(f); thumbs.appendChild(img);
  });
});
$('writep').addEventListener('change', () => { $('pmodel').disabled = !$('writep').checked; });

async function readNdjson(response, onEvent) {
  const reader = response.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (line) {
        try { onEvent(JSON.parse(line)); } catch (_) {}
      }
    }
  }
  if (buf.trim()) {
    try { onEvent(JSON.parse(buf.trim())); } catch (_) {}
  }
}

let lastImg = '';
$('share').addEventListener('click', async () => {
  if (!lastImg) return;
  try {
    const blob = await (await fetch(lastImg)).blob();
    const file = new File([blob], 'imagegen.png', { type: blob.type || 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'ImageGen' });
    } else { $('dl').click(); }   // 不支援分享 → 退回下載
  } catch (e) { /* 使用者取消或不支援，忽略 */ }
});

$('supir_btn').addEventListener('click', async () => {
  if (!lastImg) return;
  const btn = $('supir_btn');
  btn.disabled = true;
  btn.textContent = '🔍 SUPIR 放大處理中…';
  $('bar').style.display = 'block';

  const t0 = Date.now();
  let stageMsg = '🔍 SUPIR 正在修復細節並放大…';
  const render = () => {
    $('status').innerHTML = '<span class="spin"></span>' + stageMsg + '（已 ' + Math.round((Date.now()-t0)/1000) + ' 秒）';
  };
  const timer = setInterval(render, 500);
  render();
  const stop = () => {
    clearInterval(timer);
    $('bar').style.display = 'none';
  };

  const fd = new FormData();
  fd.append('image_url', lastImg);
  fd.append('scale', '2.0');

  try {
    const r = await fetch('/upscale', {
      method: 'POST',
      body: fd,
      headers: { 'X-App-Token': localStorage.getItem('app_token') || '' }
    });
    if (!r.ok || !r.body) {
      stop();
      $('status').textContent = '❌ 放大失敗 HTTP ' + r.status;
      btn.disabled = false;
      btn.textContent = '🔍 SUPIR 質感放大 (2x)';
      return;
    }
    await readNdjson(r, ev => {
      if (ev.stage === 'upscaling') {
        stageMsg = ev.message || stageMsg;
      } else if (ev.stage === 'done') {
        stop();
        $('status').textContent = '✅ SUPIR 2x 放大完成（用了 ' + Math.round((Date.now()-t0)/1000) + ' 秒）';
        lastImg = ev.image_url;
        $('result').src = ev.image_url + '?t=' + Date.now();
        $('dl').href = ev.image_url;
        $('dl').setAttribute('download', 'supir_' + Date.now() + '.png');
        btn.textContent = '✨ 已完成 2x SUPIR 放大';
      } else if (ev.stage === 'error') {
        stop();
        $('status').textContent = '❌ ' + (ev.error || '放大失敗');
        btn.disabled = false;
        btn.textContent = '🔍 SUPIR 質感放大 (2x)';
      }
    });
  } catch (e) {
    stop();
    $('status').textContent = '❌ 連線失敗：' + e.message;
    btn.disabled = false;
    btn.textContent = '🔍 SUPIR 質感放大 (2x)';
  }
});

$('go').addEventListener('click', async () => {
  const intent = $('intent').value.trim();
  if (!intent) { $('status').textContent = '⚠️ 先輸入想生什麼'; return; }
  const fd = new FormData();
  fd.append('intent', intent);
  fd.append('model', $('model').value);
  fd.append('aspect', $('aspect').value);
  fd.append('resolution', $('resolution').value);
  fd.append('write_prompt', $('writep').checked ? 'true' : 'false');
  fd.append('prompt_model', $('pmodel').value);
  [...$('files').files].slice(0,5).forEach(f => fd.append('refs', f));

  $('go').disabled = true; $('result').style.display='none'; $('prompt').style.display='none';
  $('bar').style.display='block'; $('actions').classList.remove('show');
  $('supir_btn').disabled = false; $('supir_btn').textContent = '🔍 SUPIR 質感放大 (2x)';
  const post = () => fetch('/generate', { method:'POST', body:fd,
    headers: { 'X-App-Token': localStorage.getItem('app_token') || '' } });

  // 跳動的階段訊息 + 秒數（就算串流被緩衝，計時器照跳，不會像當機）
  const isLocal = $('model').value.startsWith('local/');   // 本地 9B vs apipass → 文案不同
  const isUncensored = $('model').value.includes('uncensored');
  const genMsg = isLocal ? ('🎨 本地 9B' + (isUncensored ? '（無審查）' : '') + ' 生圖中…（' + (window.__hostConfig && window.__hostConfig.is_32gb ? '32GB M5 原生 ~40秒' : '24GB Mac mini ~90秒') + '）')
                         : '🎨 生圖中…（apipass，通常還要 20–50 秒）';
  const t0 = Date.now();
  let stageMsg = $('writep').checked ? '✍️ Claude 正在寫 prompt…' : genMsg;
  const render = () => { $('status').innerHTML =
    '<span class="spin"></span>' + stageMsg + '（已 ' + Math.round((Date.now()-t0)/1000) + ' 秒）'; };
  const timer = setInterval(render, 500); render();
  const stop = () => { clearInterval(timer); $('bar').style.display='none'; };

  const onEvent = (ev) => {
    if (ev.stage === 'writing_prompt') {         // 寫 prompt 心跳（保活）：顯示伺服器已等秒數
      stageMsg = '✍️ Claude 正在寫 prompt…（伺服器已等 ' + (ev.waited || 0) + ' 秒）';
    } else if (ev.stage === 'prompt') {
      if (ev.prompt) {
        $('prompt').textContent = '📝 ' + ev.prompt + (ev.note ? '　（' + ev.note + '）' : '');
        $('prompt').style.display='block';
      }
      stageMsg = genMsg;
    } else if (ev.stage === 'generating') {
      stageMsg = genMsg;
    } else if (ev.stage === 'progress') {
      stageMsg = (isLocal ? '🎨 本地 9B 生圖中…（已跑 ' : '🎨 生圖中…（apipass 處理中，伺服器已等 ')
               + (ev.waited || 0) + ' 秒）';
    } else if (ev.stage === 'done') {
      stop();
      $('status').textContent = '✅ 完成（用了 ' + Math.round((Date.now()-t0)/1000) + ' 秒）';
      lastImg = ev.image_url;
      $('result').src = ev.image_url + '?t=' + Date.now(); $('result').style.display='block';
      $('dl').href = ev.image_url; $('dl').setAttribute('download', 'imagegen_' + Date.now() + '.png');
      $('actions').classList.add('show');
    } else if (ev.stage === 'error') {
      stop();
      $('status').textContent = '❌ ' + (ev.error || '失敗') + (ev.where ? ' ('+ev.where+')' : '');
    }
  };

  try {
    let r = await post();
    if (r.status === 401) {                       // 後端有設 APP_TOKEN（公開路線）
      const t = prompt('需要存取 token：'); if (t) { localStorage.setItem('app_token', t); r = await post(); }
    }
    if (r.status === 401) { stop(); $('status').textContent = '❌ token 不正確'; return; }
    if (!r.ok || !r.body) { stop(); $('status').textContent = '❌ HTTP ' + r.status; return; }
    await readNdjson(r, onEvent);
  } catch (e) {
    stop(); $('status').textContent = '❌ 連線失敗：' + e.message;
  } finally { $('go').disabled = false; }
});

// ── 相簿自選照片 SUPIR 修復／放大 ──
let upLastImg = '';
$('up_file').addEventListener('change', () => {
  const f = $('up_file').files[0];
  if (f) {
    $('up_thumb').src = URL.createObjectURL(f);
    $('up_thumb_box').style.display = 'block';
  } else {
    $('up_thumb_box').style.display = 'none';
  }
});

$('up_share').addEventListener('click', async () => {
  if (!upLastImg) return;
  try {
    const blob = await (await fetch(upLastImg)).blob();
    const file = new File([blob], 'supir_upscale.png', { type: blob.type || 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'SUPIR 放大成果' });
    } else {
      $('up_dl').click();
    }
  } catch (_) {}
});

$('up_go').addEventListener('click', async () => {
  const f = $('up_file').files[0];
  if (!f) {
    $('up_status').textContent = '⚠️ 請先選擇一張照片';
    return;
  }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('scale', $('up_scale').value);
  fd.append('prompt', $('up_prompt').value.trim());

  $('up_go').disabled = true;
  $('up_result').style.display = 'none';
  $('up_actions').style.display = 'none';
  $('up_bar').style.display = 'block';

  const t0 = Date.now();
  let stageMsg = '🔍 SUPIR 正在載入模型與修復特徵…';
  const render = () => {
    $('up_status').innerHTML = '<span class="spin"></span>' + stageMsg + '（已 ' + Math.round((Date.now()-t0)/1000) + ' 秒）';
  };
  const timer = setInterval(render, 500);
  render();
  const stop = () => {
    clearInterval(timer);
    $('up_bar').style.display = 'none';
  };

  try {
    const r = await fetch('/upscale', {
      method: 'POST',
      body: fd,
      headers: { 'X-App-Token': localStorage.getItem('app_token') || '' }
    });
    if (!r.ok || !r.body) {
      stop();
      $('up_status').textContent = '❌ 放大失敗 HTTP ' + r.status;
      return;
    }
    await readNdjson(r, ev => {
      if (ev.stage === 'upscaling') {
        stageMsg = ev.message || stageMsg;
      } else if (ev.stage === 'done') {
        stop();
        $('up_status').textContent = '✅ SUPIR ' + ev.scale + 'x 放大完成（用了 ' + Math.round((Date.now()-t0)/1000) + ' 秒）';
        upLastImg = ev.image_url;
        $('up_result').src = ev.image_url + '?t=' + Date.now();
        $('up_result').style.display = 'block';
        $('up_dl').href = ev.image_url;
        $('up_dl').setAttribute('download', 'supir_' + Date.now() + '.png');
        $('up_actions').style.display = 'flex';
      } else if (ev.stage === 'error') {
        stop();
        $('up_status').textContent = '❌ ' + (ev.error || '放大失敗');
      }
    });
  } catch (e) {
    stop();
    $('up_status').textContent = '❌ 連線失敗：' + e.message;
  } finally {
    $('up_go').disabled = false;
  }
});

async function loadConfig() {
  try {
    const r = await fetch('/config', {
      headers: { 'X-App-Token': localStorage.getItem('app_token') || '' }
    });
    if (!r.ok) return;
    const cfg = await r.json();
    window.__hostConfig = cfg;
    if (cfg.machine) {
      const badge = $('hw-badge');
      badge.textContent = (cfg.is_32gb ? '💻 ' : '🖥️ ') + cfg.machine + (cfg.is_32gb ? ' (8-bit 原生)' : ' (4-bit 輕量)');
      badge.style.display = 'inline-block';
    }
    if (cfg.local_models && cfg.local_models.length) {
      const sel = $('model');
      [...sel.options].forEach(opt => { if (opt.value.startsWith('local/')) opt.remove(); });
      cfg.local_models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label;
        sel.appendChild(opt);
      });
      if (cfg.default_model) sel.value = cfg.default_model;
    }
    if (cfg.default_resolution && !$('resolution').value) {
      $('resolution').value = cfg.default_resolution;
    }
  } catch (e) {
    console.log('Config load skipped:', e);
  }
}
loadConfig();
</script>
</body>
</html>
